<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Changes</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap');</style>
    <link rel="stylesheet" href="styles.css">
    <style>
      #searchBox { max-width: 420px; margin-bottom: var(--sp-4); }
    </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand"><span class="bell-mark">🔔</span> Digital Smart Bell System</div>
      <nav>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="recent.html">Recent Changes</a>
      </nav>
    </div>

    <div class="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">Recent Timetable Changes</h1>
          <p class="subtitle text-secondary">A log of edits made to timetables, most recent first.</p>
        </div>
      </div>

      <div class="panel">
        <input type="text" id="searchBox" class="input" placeholder="Search teacher, batch, day, period or action…">

        <div class="table-wrap">
          <table class="data-table" id="changesTable">
            <thead>
            <tr>
                <th>Date &amp; Time</th>
                <th>Teacher</th>
                <th>Batch</th>
                <th>Day</th>
                <th>Period</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="changesBody">
                <tr><td colspan="6" class="loading-row">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="firebase-config.js"></script>

<script>
function safe(v) {
    return (v === null || v === undefined || v === "") ? "N/A" : v;
}

let allChanges = [];

function loadRecentChanges() {
    const tbody = document.getElementById("changesBody");
    tbody.innerHTML = "<tr><td colspan='6' class='loading-row'>Loading...</td></tr>";

    firebase.database().ref("recentChanges")
        .orderByChild("timestamp")
        .limitToLast(200)
        .on("value", (snapshot) => {  // LIVE UPDATES
            tbody.innerHTML = "";

            if (!snapshot.exists()) {
                tbody.innerHTML = "<tr><td colspan='6'><div class='empty-state'><div class='empty-icon'>🕓</div><div class='empty-title'>No changes yet</div><div class='text-secondary'>Timetable edits will show up here.</div></div></td></tr>";
                return;
            }

            allChanges = Object.values(snapshot.val()).reverse();
            renderTable(allChanges);
        });
}

function renderTable(data) {
    const tbody = document.getElementById("changesBody");
    tbody.innerHTML = "";

    if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' class='loading-row'>No matches found.</td></tr>";
        return;
    }

    data.forEach(entry => {
        const date = entry.timestamp
            ? new Date(entry.timestamp).toLocaleString()
            : "N/A";

        tbody.innerHTML += `
            <tr>
                <td>${safe(date)}</td>
                <td>${safe(entry.teacher)}</td>
                <td>${safe(entry.batch)}</td>
                <td>${safe(entry.day)}</td>
                <td>${safe(entry.period)}</td>
                <td>${safe(entry.action)}</td>
            </tr>
        `;
    });
}

document.getElementById("searchBox").addEventListener("input", function () {
    const text = this.value.toLowerCase();
    const filtered = allChanges.filter(ch =>
        JSON.stringify(ch).toLowerCase().includes(text)
    );
    renderTable(filtered);
});

loadRecentChanges();
</script>

</body>
</html>
