<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Announcements — Teacher</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap');</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="glass.css">
  <meta name="theme-color" content="#000000">
  <script src="gargantua/boot.js"></script>
  <script src="gargantua/dist/gargantua.js" defer></script>
  <script src="shell.js" defer></script>
  <style>
    .ann-row {
      display: flex; justify-content: space-between; gap: var(--sp-4);
      padding: var(--sp-4) 0; border-bottom: 1px solid var(--border);
    }
    .ann-row:last-child { border-bottom: none; }
    .ann-row h3 { font-size: var(--fs-card-title); font-weight: 600; margin-bottom: var(--sp-1); display: flex; align-items: center; gap: var(--sp-2); }
    .ann-row p { font-size: var(--fs-body); margin-bottom: var(--sp-2); white-space: pre-wrap; }
    .ann-actions { display: flex; gap: var(--sp-2); flex-shrink: 0; }

    #annList {
      max-height: 560px;
      overflow-y: auto;
      padding-right: var(--sp-2);
    }
    #annList::-webkit-scrollbar { width: 8px; }
    #annList::-webkit-scrollbar-track { background: transparent; }
    #annList::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-pill); }
    #annList::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="app-shell">
    <div class="topbar">
      <a class="brand" href="index.html"><span class="bell-mark"><i class="fa-solid fa-bell"></i></span> Digital Smart Bell System</a>
      <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
      <nav>
        <a class="nav-link" href="index-teacher.html">Home</a>
        <a class="nav-link" href="edit.html">Edit Timetable</a>
        <a class="nav-link active" href="announcements-edit.html">Announcements</a>
        <a class="nav-link" href="recent.html">Recent Changes</a>
        <a class="nav-link" href="simulator.html">Bell Simulator</a>
      </nav>
      <div class="right">
        <span class="role-tag">Teacher</span>
        <button class="btn btn-danger" id="signOutBtn">Sign Out</button>
      </div>
    </div>

    <div class="main" id="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Manage Announcements</h1>
          <p class="subtitle text-secondary">Post new updates and manage existing ones.</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2 class="section-title">Post New Announcement</h2></div>
        <div class="field">
          <label class="label" for="title">Title</label>
          <input id="title" class="input" placeholder="Announcement title">
        </div>
        <div class="field">
          <label class="label" for="message">Message</label>
          <textarea id="message" class="textarea" placeholder="Write message..."></textarea>
        </div>
        <button class="btn btn-primary" id="postBtn">Post Announcement</button>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 class="section-title">All Announcements</h2>
          <input type="text" id="annSearch" class="input" style="width:auto;max-width:260px;" placeholder="Search announcements…">
        </div>
        <div id="annList"><div class="loading-row">Loading...</div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="successToast"><i class="fa-solid fa-circle-check"></i> Announcement posted</div>

  <!-- Edit announcement modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="section-title">Edit Announcement</h2>
        <button class="modal-close" id="editModalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="field">
        <label class="label" for="editTitle">Title</label>
        <input id="editTitle" class="input" placeholder="Announcement title">
      </div>
      <div class="field">
        <label class="label" for="editMessage">Message</label>
        <textarea id="editMessage" class="textarea"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="editCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="editSaveBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="teacher-config.js"></script>

  <script>
    const db = firebase.database();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      if (!user || !isTeacherEmail(user.email)) location.href = "index.html";
    });

    document.getElementById("signOutBtn").onclick =
      () => auth.signOut().then(() => location.href = "index.html");

    function showToast(msg, kind) {
      const t = document.getElementById("successToast");
      t.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg || "Announcement posted"}`;
      t.classList.remove("toast-success", "toast-error");
      t.classList.add("show", kind === "error" ? "toast-error" : "toast-success");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    document.getElementById("postBtn").onclick = () => {
      const t = document.getElementById("title").value.trim();
      const m = document.getElementById("message").value.trim();

      if (!t || !m) return alert("Fill all fields");

      const postBtn = document.getElementById("postBtn");
      postBtn.disabled = true;
      postBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Posting…';

      db.ref("announcements").push({
        title: t,
        message: m,
        timestamp: Date.now(),
        postedBy: auth.currentUser.email
      }).then(() => {
        showToast("Announcement posted", "success");
        document.getElementById("title").value = "";
        document.getElementById("message").value = "";
      }).catch(err => {
        alert("Failed to post announcement: " + err.message);
      }).finally(() => {
        postBtn.disabled = false;
        postBtn.innerHTML = "Post Announcement";
      });
    };

    function escapeHtml(t) {
      return String(t ?? "")
        .replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
    }

    let allAnnouncements = [];

    function renderAnnouncements(arr) {
        const box = document.getElementById("annList");

        if (arr.length === 0) {
          box.innerHTML = allAnnouncements.length === 0
            ? `<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-bullhorn"></i></div><div class="empty-title">No announcements yet</div><div class="text-secondary">Post your first announcement above.</div></div>`
            : `<div class="empty-state"><div class="empty-icon"><i class="fa-solid fa-magnifying-glass"></i></div><div class="empty-title">No matches</div><div class="text-secondary">Try a different search.</div></div>`;
          return;
        }

        // Render each row individually so one malformed entry can't blank out
        // the whole list (previously a single throw inside .map() would abort
        // the entire innerHTML update and leave the page stuck on stale data).
        const rowsHtml = arr.map(a => {
          try {
            const isNew = a.timestamp && (Date.now() - a.timestamp) < 24 * 60 * 60 * 1000;
            return `
              <div class="ann-row">
                <div>
                  <h3>${escapeHtml(a.title)} ${isNew ? '<span class="badge badge-accent">New</span>' : ''}</h3>
                  <p>${escapeHtml(a.message)}</p>
                  <div class="text-muted">
                    Posted by ${escapeHtml(a.postedBy)} · ${a.timestamp ? new Date(a.timestamp).toLocaleString() : "Time not available"}
                    ${a.editedAt ? ` · edited ${new Date(a.editedAt).toLocaleString()}` : ""}
                  </div>
                </div>

                <div class="ann-actions">
                  <button class="btn btn-secondary btn-sm" onclick="editAnn('${a.id}')">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="delAnn('${a.id}')">Delete</button>
                </div>
              </div>
            `;
          } catch (rowErr) {
            console.error("[announcements-edit] failed to render entry", a.id, rowErr);
            return `<div class="ann-row"><div><div class="text-secondary">⚠ Couldn't display this announcement (id: ${escapeHtml(a.id)}).</div></div></div>`;
          }
        });

        box.innerHTML = rowsHtml.join("");
    }

    function applyAnnFilter() {
      const text = document.getElementById("annSearch").value.toLowerCase();
      if (!text) return renderAnnouncements(allAnnouncements);
      renderAnnouncements(allAnnouncements.filter(a => JSON.stringify(a).toLowerCase().includes(text)));
    }
    document.getElementById("annSearch").addEventListener("input", applyAnnFilter);

    // Plain listener on the whole node (no orderByChild) — avoids any query/index
    // edge cases and sorts client-side instead, same fix applied to recent.html.
    db.ref("announcements").on("value", snap => {
        if (!snap.exists()) {
          allAnnouncements = [];
          renderAnnouncements([]);
          return;
        }

        const arr = [];
        snap.forEach(s => arr.push({ id: s.key, ...s.val() }));
        arr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        allAnnouncements = arr;
        applyAnnFilter();
      }, (err) => {
        document.getElementById("annList").innerHTML = `<div class="alert alert-error"><i class="fa-solid fa-triangle-exclamation"></i>&nbsp; Couldn't load announcements — ${escapeHtml(err.message)}</div>`;
      });

    let editingId = null;
    const editModal = document.getElementById("editModal");

    function openEditModal(id, title, message) {
      editingId = id;
      document.getElementById("editTitle").value = title || "";
      document.getElementById("editMessage").value = message || "";
      editModal.classList.add("open");
      document.getElementById("editTitle").focus();
    }

    function closeEditModal() {
      editModal.classList.remove("open");
      editingId = null;
    }

    document.getElementById("editModalClose").onclick = closeEditModal;
    document.getElementById("editCancelBtn").onclick = closeEditModal;
    editModal.addEventListener("click", (e) => { if (e.target === editModal) closeEditModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && editModal.classList.contains("open")) closeEditModal(); });

    document.getElementById("editSaveBtn").onclick = () => {
      if (!editingId) return;
      const nt = document.getElementById("editTitle").value.trim();
      const nm = document.getElementById("editMessage").value.trim();
      if (!nt || !nm) return alert("Title and message can't be empty.");

      const saveBtn = document.getElementById("editSaveBtn");
      saveBtn.disabled = true;

      db.ref("announcements/" + editingId).update({
        title: nt,
        message: nm,
        editedAt: Date.now()
      }).then(() => {
        closeEditModal();
        showToast("Announcement updated", "success");
      }).catch(err => {
        alert("Failed to save: " + err.message);
      }).finally(() => {
        saveBtn.disabled = false;
      });
    };

    function editAnn(id) {
      db.ref("announcements/"+id).once("value").then(s => {
        const v = s.val() || {};
        openEditModal(id, v.title, v.message);
      });
    }

    function delAnn(id) {
      if (confirm("Delete this announcement? This can't be undone.")) {
        db.ref("announcements/"+id).remove()
          .then(() => showToast("Announcement deleted", "success"))
          .catch(err => alert("Failed to delete: " + err.message));
      }
    }
  </script>

</body>
</html>
