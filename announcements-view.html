<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Announcements — Student</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap');</style>
  <link rel="stylesheet" href="styles.css">
  <style>
    .ann { border-bottom: 1px solid var(--border); padding: var(--sp-4) 0; }
    .ann:last-child { border-bottom: none; }
    .ann h3 { font-size: var(--fs-card-title); font-weight: 600; margin-bottom: var(--sp-1); }
    .ann p { font-size: var(--fs-body); color: var(--text); margin-bottom: var(--sp-2); white-space: pre-wrap; }
  </style>
</head>

<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand"><span class="bell-mark">🔔</span> Digital Smart Bell System</div>
      <nav>
        <a class="nav-link" href="index-student.html">Home</a>
        <a class="nav-link" href="view.html">Timetable</a>
        <a class="nav-link active" href="announcements-view.html">Announcements</a>
        <a class="nav-link" href="recent.html">Recent Changes</a>
      </nav>
      <div class="right"><span class="role-tag">Student</span></div>
    </div>

    <div class="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">Announcements</h1>
          <p class="subtitle text-secondary">Notices posted by your teachers.</p>
        </div>
      </div>

      <div class="panel" id="annList">
        <div class="loading-row">Loading…</div>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB3Lv_9EiVBVy5aXwiYOn0pgZu31ykFOGM",
    authDomain: "digitalbellplisworkthistime.firebaseapp.com",
    databaseURL: "https://digitalbellplisworkthistime-default-rtdb.firebaseio.com",
    projectId: "digitalbellplisworkthistime",
    storageBucket: "digitalbellplisworkthistime.firebasestorage.app",
    messagingSenderId: "829189847707",
    appId: "1:829189847707:web:99b13d5fe551b54d9ce43e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const box = document.getElementById("annList");

  db.ref("announcements").on("value", snap => {
    box.innerHTML = "";

    if (!snap.exists()) {
      box.innerHTML = `<div class="empty-state"><div class="empty-icon">📣</div><div class="empty-title">No announcements yet</div><div class="text-secondary">Check back later for updates from your teachers.</div></div>`;
      return;
    }

    const items = [];

    snap.forEach(child => {
      const v = child.val() || {};
      items.push({
        title: v.title || "Untitled",
        message: v.message || "",
        postedBy: v.postedBy || "Teacher",
        timestamp: v.timestamp || 0
      });
    });

    items
      .sort((a,b) => b.timestamp - a.timestamp)
      .forEach(a => {
        const timeText = a.timestamp
          ? new Date(a.timestamp).toLocaleString()
          : "Time not available";

        box.insertAdjacentHTML("beforeend", `
          <div class="ann">
            <h3>${escape(a.title)}</h3>
            <p>${escape(a.message)}</p>
            <div class="text-muted">Posted by ${escape(a.postedBy)} • ${timeText}</div>
          </div>
        `);
      });
  });

  function escape(t) {
    return String(t).replace(/[&<>]/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;"
    }[c]));
  }
</script>

</body>
</html>
