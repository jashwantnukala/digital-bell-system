<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Timetable</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap');</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    #timetableTable { width: 100%; border-collapse: collapse; font-size: var(--fs-secondary); }
    #timetableTable th {
      text-align: left; font-size: var(--fs-label); font-weight: 600; color: var(--text-secondary);
      padding: var(--sp-3); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    #timetableTable td { padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); vertical-align: top; }

    .cell-subj, .cell-room, .cell-time {
      width: 100%;
      height: 36px;
      padding: 0 var(--sp-2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      font-size: var(--fs-secondary);
      font-family: var(--font);
      box-sizing: border-box;
      margin-bottom: var(--sp-1);
      background: var(--surface);
      color: var(--text);
    }
    .cell-subj:focus, .cell-room:focus, .cell-time:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .cell-time { font-weight: 600; }

    .save-row { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-6); }
    #message { font-size: var(--fs-secondary); }
    #message.success { color: var(--success); }
    #message.error { color: var(--danger); }
  </style>
</head>

<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand"><span class="bell-mark"><i class="fa-solid fa-bell"></i></span> Digital Smart Bell System</div>
      <nav>
        <a class="nav-link" href="index-teacher.html">Home</a>
        <a class="nav-link active" href="edit.html">Edit Timetable</a>
        <a class="nav-link" href="announcements-edit.html">Announcements</a>
        <a class="nav-link" href="recent.html">Recent Changes</a>
        <a class="nav-link" href="simulator.html">Bell Simulator</a>
      </nav>
      <div class="right"><span class="role-tag">Teacher</span></div>
    </div>

    <div class="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">Edit Timetable</h1>
          <p class="subtitle text-secondary">Select a batch, edit any cell, then save your changes.</p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-secondary" id="batch1Btn">Batch 1</button>
          <button class="btn btn-secondary" id="batch2Btn">Batch 2</button>
        </div>
      </div>

      <div class="panel">
        <div class="table-wrap" id="gridContainer">
          <table id="timetableTable">
            <tbody>
              <tr><td class="loading-row">Select a batch above to start editing.</td></tr>
            </tbody>
          </table>
        </div>

        <div class="save-row">
          <button class="btn btn-primary" id="saveBtn">Save Changes</button>
          <div id="message"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase FIRST (important) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Your config -->
  <script src="firebase-config.js"></script>
  <script src="teacher-config.js"></script>
  <script src="auth.js"></script>

  <!-- 🔐 AUTH PROTECTION (now placed correctly) -->
  <script>
  firebase.auth().onAuthStateChanged(user => {
      if (!user) {
          alert("Access denied. Please log in as a teacher.");
          window.location.href = "index.html";
          return;
      }

      if (!isTeacherEmail(user.email)) {
          alert("Unauthorized access! Students cannot edit timetable.");
          firebase.auth().signOut();
          window.location.href = "index.html";
      }
  });
  </script>

  <!-- MAIN TIMETABLE SCRIPT -->
  <script>
    (function () {
      const db = firebase.database();
      const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
      let currentBatch = "";
      let originalRows = []; // snapshot taken at load time, used to diff on save

      const tableEl = document.getElementById("timetableTable");
      const messageEl = document.getElementById("message");

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g,'&amp;')
          .replace(/"/g,'&quot;')
          .replace(/'/g,'&#39;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;');
      }

      function renderGrid(rows) {
        let html = "<thead><tr><th>Time</th>";
        days.forEach(d => { html += `<th>${d}</th>`; });
        html += "</tr></thead><tbody>";

        rows.forEach((r, rowIdx) => {
          html += `<tr data-row="${rowIdx}">`;
          html += `<td><input class="cell-time" value="${escapeHtml(r.time)}"></td>`;

          days.forEach(d => {
            const cell = r[d] || {subject:"N/A", room:"N/A"};
            html += `
              <td>
                <input class="cell-subj" value="${escapeHtml(cell.subject)}">
                <input class="cell-room" value="${escapeHtml(cell.room)}">
              </td>`;
          });

          html += "</tr>";
        });

        html += "</tbody>";
        tableEl.innerHTML = html;
      }

      function loadBatch(batch) {
        currentBatch = batch;
        messageEl.textContent = "";
        messageEl.className = "";
        document.getElementById("batch1Btn").classList.toggle("active", batch === "Batch1");
        document.getElementById("batch2Btn").classList.toggle("active", batch === "Batch2");

        tableEl.innerHTML = `<tbody><tr><td class="loading-row">Loading…</td></tr></tbody>`;

        db.ref("timetables/" + batch).once("value").then(snap => {
          if (snap.exists()) {
            const data = snap.val();
            // deep copy for later diffing — snap.val() rows may be objects, normalize to array
            originalRows = (Array.isArray(data) ? data : Object.values(data)).map(r => JSON.parse(JSON.stringify(r)));
            renderGrid(originalRows);
          } else {
            originalRows = [];
            tableEl.innerHTML = `<tbody><tr><td class="loading-row">No timetable found for this batch.</td></tr></tbody>`;
          }
        }).catch(() => {
          tableEl.innerHTML = `<tbody><tr><td class="loading-row">Couldn't load timetable. Try again.</td></tr></tbody>`;
        });
      }

      function readGridRows() {
        const rows = [];
        const trs = tableEl.querySelectorAll("tbody tr");

        trs.forEach(tr => {
          const time = tr.querySelector(".cell-time").value || "N/A";
          const rowObj = { time };

          days.forEach((d, i) => {
            const subj = tr.querySelectorAll(".cell-subj")[i].value || "N/A";
            const room = tr.querySelectorAll(".cell-room")[i].value || "N/A";
            rowObj[d] = { subject: subj, room: room };
          });

          rows.push(rowObj);
        });

        return rows;
      }

      // Compare the just-saved rows against the snapshot taken at load time
      // and build one change-log entry per field that actually changed.
      function buildChangeLog(oldRows, newRows) {
        const entries = [];
        const teacherEmail = (firebase.auth().currentUser && firebase.auth().currentUser.email) || "Unknown teacher";
        const count = Math.max(oldRows.length, newRows.length);

        for (let i = 0; i < count; i++) {
          const oldRow = oldRows[i] || {};
          const newRow = newRows[i] || {};
          const period = i + 1;
          const newTime = newRow.time || "N/A";

          if ((oldRow.time || "N/A") !== newTime) {
            entries.push({
              batch: currentBatch,
              day: "All days",
              period,
              time: newTime,
              field: "Time",
              before: oldRow.time || "N/A",
              after: newTime,
              action: "Time changed",
              teacher: teacherEmail,
              timestamp: Date.now()
            });
          }

          days.forEach(d => {
            const oldCell = oldRow[d] || { subject: "N/A", room: "N/A" };
            const newCell = newRow[d] || { subject: "N/A", room: "N/A" };

            if ((oldCell.subject || "N/A") !== (newCell.subject || "N/A")) {
              entries.push({
                batch: currentBatch,
                day: d,
                period,
                time: newTime,
                field: "Subject",
                before: oldCell.subject || "N/A",
                after: newCell.subject || "N/A",
                action: "Subject changed",
                teacher: teacherEmail,
                timestamp: Date.now()
              });
            }

            if ((oldCell.room || "N/A") !== (newCell.room || "N/A")) {
              entries.push({
                batch: currentBatch,
                day: d,
                period,
                time: newTime,
                field: "Room",
                before: oldCell.room || "N/A",
                after: newCell.room || "N/A",
                action: "Room changed",
                teacher: teacherEmail,
                timestamp: Date.now()
              });
            }
          });
        }

        return entries;
      }

      function logChanges(entries) {
        if (entries.length === 0) return Promise.resolve();
        const updates = {};
        entries.forEach(entry => {
          const key = db.ref("recentChanges").push().key;
          updates["recentChanges/" + key] = entry;
        });
        return db.ref().update(updates);
      }

      function save() {
        if (!currentBatch) return alert("Select a batch first!");

        const rows = readGridRows();
        const changeLog = buildChangeLog(originalRows, rows);

        const saveBtn = document.getElementById("saveBtn");
        saveBtn.disabled = true;
        messageEl.textContent = "";
        messageEl.className = "";

        db.ref("timetables/" + currentBatch).set(rows)
          .then(() => logChanges(changeLog))
          .then(() => {
            messageEl.innerHTML = changeLog.length
              ? `<i class="fa-solid fa-circle-check"></i> Saved — ${changeLog.length} change${changeLog.length === 1 ? "" : "s"} logged.`
              : `<i class="fa-solid fa-circle-check"></i> Saved (no changes detected).`;
            messageEl.className = "success";
            originalRows = rows.map(r => JSON.parse(JSON.stringify(r))); // reset baseline for next diff
            saveBtn.disabled = false;
            setTimeout(() => { messageEl.textContent = ""; messageEl.className = ""; }, 3000);
          })
          .catch((err) => {
            messageEl.textContent = "Save failed: " + (err && err.message ? err.message : "please try again.");
            messageEl.className = "error";
            saveBtn.disabled = false;
          });
      }

      document.getElementById("batch1Btn").onclick = () => loadBatch("Batch1");
      document.getElementById("batch2Btn").onclick = () => loadBatch("Batch2");
      document.getElementById("saveBtn").onclick = save;
    })();
  </script>

</body>
</html>
